name: Android — Play Store Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # e.g. v1.2.3
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal | production)'
        required: true
        default: 'internal'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    name: Build & Publish to Play Store
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_PATH:     /tmp/release.keystore
      GOOGLE_PLAY_JSON_KEY_PATH: /tmp/play_key.json
      # Passwords injected from GitHub secrets
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # ── Checkout ────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── Node + Bun ──────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ── Ruby + Bundler (Fastlane) ───────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      # ── Write secrets to disk ───────────────────
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

      - name: Write Google Play JSON key
        run: echo '${{ secrets.GOOGLE_PLAY_JSON_KEY }}' > /tmp/play_key.json

      - name: Create .env
        run: echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      # ── Run tests before release ─────────────────
      - name: Run JS tests
        run: node node_modules/.bin/jest --passWithNoTests --ci

      # ── Fastlane ─────────────────────────────────
      - name: Determine track
        id: track
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "lane=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
          else
            echo "lane=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Fastlane — build & upload
        run: bundle exec fastlane ${{ steps.track.outputs.lane }}
        working-directory: android

      # ── Upload AAB artifact ──────────────────────
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VibeTrack-${{ github.ref_name }}.aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
